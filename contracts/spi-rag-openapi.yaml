openapi: 3.0.3
info:
  title: SPI Chunking Contract and Atlas Vector API
  version: 1.0.0
  description: Contract for text chunking, vector indexing, semantic retrieval, and optional NVIDIA reranking.
servers:
  - url: http://localhost:3000
    description: SPI NestJS backend (indexing and retrieval)
security:
  - bearerAuth: []
paths:
  /api/v1/chunking/chunks:
    post:
      operationId: createChunks
      summary: Split extracted page text into traceable passages
      servers:
        - url: https://chunk-service.internal
          description: External chunking service; configure with CHUNKING_API_BASE_URL
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChunkRequest'
      responses:
        '200':
          description: Chunks created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/indexing/chunks:
    post:
      operationId: indexChunks
      summary: Embed passages and upsert vectors and metadata
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexRequest'
      responses:
        '200':
          description: Chunks indexed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/ProviderFailure' }
  /api/v1/retrieval/search:
    post:
      operationId: searchSources
      summary: Vector search and optionally rerank candidate passages
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Ranked source passages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ProviderFailure' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SPI service token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid internal service token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Idempotency key reused with a different request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ProviderFailure:
      description: NVIDIA or vector store provider failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    PageText:
      type: object
      required: [pageNumber, text]
      properties:
        pageNumber: { type: integer, minimum: 1 }
        text: { type: string, minLength: 1, maxLength: 100000 }
        section: { type: string, nullable: true }
    ChunkOptions:
      type: object
      properties:
        maxTokens: { type: integer, minimum: 100, maximum: 3000, default: 700 }
        overlapTokens: { type: integer, minimum: 0, maximum: 1000, default: 100 }
        preservePageBoundaries: { type: boolean, default: true }
    ChunkRequest:
      type: object
      required: [documentId, documentVersionId, pages]
      properties:
        documentId: { type: string }
        documentVersionId: { type: string }
        pages:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/PageText' }
        options: { $ref: '#/components/schemas/ChunkOptions' }
    Chunk:
      type: object
      required: [chunkId, text, pageStart, pageEnd, ordinal]
      properties:
        chunkId: { type: string }
        text: { type: string }
        pageStart: { type: integer }
        pageEnd: { type: integer }
        section: { type: string, nullable: true }
        ordinal: { type: integer, minimum: 0 }
        tokenCount: { type: integer, minimum: 1 }
    ChunkResponse:
      type: object
      required: [documentId, documentVersionId, chunks, count, requestId]
      properties:
        documentId: { type: string }
        documentVersionId: { type: string }
        chunks:
          type: array
          items: { $ref: '#/components/schemas/Chunk' }
        count: { type: integer }
        requestId: { type: string }
    IndexRequest:
      type: object
      required: [documentId, documentVersionId, chunks]
      properties:
        documentId: { type: string }
        documentVersionId: { type: string }
        chunks:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/Chunk' }
    IndexResponse:
      type: object
      required: [status, documentId, documentVersionId, indexedCount, skippedCount, embeddingModel, requestId]
      properties:
        status: { type: string, enum: [INDEXED] }
        documentId: { type: string }
        documentVersionId: { type: string }
        indexedCount: { type: integer }
        skippedCount: { type: integer }
        embeddingModel: { type: string }
        requestId: { type: string }
    SearchFilters:
      type: object
      properties:
        documentIds:
          type: array
          items: { type: string }
        documentVersionIds:
          type: array
          items: { type: string }
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 8000 }
        filters: { $ref: '#/components/schemas/SearchFilters' }
        topK: { type: integer, minimum: 1, maximum: 100, default: 20 }
        rerank: { type: boolean, default: true }
        rerankTopN: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Source:
      type: object
      required: [chunkId, documentId, documentVersionId, pageStart, pageEnd, text, retrievalScore]
      properties:
        chunkId: { type: string }
        documentId: { type: string }
        documentVersionId: { type: string }
        pageStart: { type: integer }
        pageEnd: { type: integer }
        section: { type: string, nullable: true }
        text: { type: string }
        retrievalScore: { type: number }
        rerankScore: { type: number, nullable: true }
    SearchResponse:
      type: object
      required: [query, sources, count, embeddingModel, requestId]
      properties:
        query: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        count: { type: integer }
        embeddingModel: { type: string }
        rerankModel: { type: string, nullable: true }
        requestId: { type: string }
    ErrorDetail:
      type: object
      properties:
        field: { type: string }
        issue: { type: string }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
        requestId: { type: string }
